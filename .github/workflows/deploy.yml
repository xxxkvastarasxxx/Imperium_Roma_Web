name: Deploy to IONOS

on:
  push:
    branches:
      - main  # Deploy when pushing to main branch
  workflow_dispatch:  # Allow manual deployment from GitHub Actions tab

jobs:
  deploy:
    name: Build & Deploy to IONOS Web Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build optimized site (-> dist/)
        run: npm run build

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/*'
          remote_path: '/Imperium_Roma'
          sftp_only: true
          args: '-o ConnectTimeout=10'

      # The glob above is expanded by the shell, and `*` never matches dotfiles, so
      # every .htaccess in dist/ was silently skipped on every deploy — routing,
      # security headers and error documents could not be changed from this repo at
      # all. Each dotfile therefore needs its own step; add one here if a new one
      # ever appears in the build output.
      - name: Deploy root .htaccess (dotfiles are not covered by the glob)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/.htaccess'
          remote_path: '/Imperium_Roma'
          sftp_only: true
          args: '-o ConnectTimeout=10'

      # Denies web access to config/, which holds the real telegram.php and
      # newsletter.php credentials on the server.
      - name: Deploy config/.htaccess
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/config/.htaccess'
          remote_path: '/Imperium_Roma/config'
          sftp_only: true
          args: '-o ConnectTimeout=10'
