name: Deploy to IONOS

on:
  push:
    branches:
      - main  # Deploy when pushing to main branch
  workflow_dispatch:  # Allow manual deployment from GitHub Actions tab

jobs:
  deploy:
    name: Deploy to IONOS Web Hosting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Remove repository-only files
        run: |
          rm -f DEPLOYMENT.md README.md Imperium.png deploy.ps1 .gitignore .htaccess
          rm -rf .github .vscode logs node_modules
          echo "Cleaned up repo-only files"
        
      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './*'
          remote_path: '/Imperium_Roma'
          sftp_only: true
          args: '-o ConnectTimeout=10'
