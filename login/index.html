<body>
    <div class="page-container">
        <!-- Background elements -->
        <div class="background">
            <div class="roman-column left"></div>
            <div class="roman-column right"></div>
            <div class="bg-overlay"></div>
        </div>
        
        <!-- Main content -->
        <div class="content-container">
            <main class="auth-container">
                <div class="header-logo">
                    <div class="footer-logo">
                        <img src="/assets/images/icons/favicon.ico" alt="Imperium Roma Logo">
                    </div>
                </div>
                
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">Login</button>
                    <button class="tab-btn" data-tab="signup">Sign Up</button>
                </div>
                
                <div class="tab-content active" id="login-tab">
                    <h2>Access Your Domus</h2>
                    <form id="login-form" class="auth-form">
                        <div class="form-group">
                            <label for="login-username">Username or Email</label>
                            <div class="input-with-icon">
                                <i class="fas fa-user"></i>
                                <input type="text" id="login-username" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="login-password" required>
                                <button type="button" class="toggle-password" tabindex="-1">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="form-options">
                            <div class="remember-me">
                                <input type="checkbox" id="remember-me">
                                <label for="remember-me">Remember me</label>
                            </div>
                            <a href="/login/reset-password/" class="forgot-password">Forgot password?</a>
                        </div>
                        
                        <button type="submit" class="btn-auth">Enter Domus</button>
                    </form>
                    
                    <div class="auth-divider">
                        <span>OR</span>
                    </div>
                    
                    <div class="social-auth">
                        <button class="btn-social google">
                            <i class="fab fa-google"></i> Continue with Google
                        </button>
                        <!-- <button class="btn-social facebook">
                            <i class="fab fa-facebook-f"></i> Continue with Facebook
                        </button> -->
                    </div>
                </div>
                
                <div class="tab-content" id="signup-tab">
                    <h2>Create Your Domus</h2>
                    <form id="signup-form" class="auth-form">                        
                        <div class="form-group">
                            <label for="signup-email">Email</label>
                            <div class="input-with-icon">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="signup-email" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="signup-password">Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="signup-password" required>
                                <button type="button" class="toggle-password" tabindex="-1">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="password-strength">
                                <div class="strength-meter">
                                    <div class="meter-section"></div>
                                    <div class="meter-section"></div>
                                    <div class="meter-section"></div>
                                    <div class="meter-section"></div>
                                </div>
                                <span class="strength-text">Password strength</span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="signup-confirm">Confirm Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="signup-confirm" required>
                            </div>
                        </div>
                        
                        <div class="terms-agreement">
                            <input type="checkbox" id="agree-terms" required>
                            <label for="agree-terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                        </div>
                        
                        <button type="submit" class="btn-auth">Create Account</button>
                    </form>
                    
                    <div class="auth-divider">
                        <span>OR</span>
                    </div>
                    
                    <div class="social-auth">
                        <button class="btn-social google">
                            <i class="fab fa-google"></i> Continue with Google
                        </button>
                        <!-- <button class="btn-social facebook">
                            <i class="fab fa-facebook-f"></i> Continue with Facebook
                        </button> -->
                    </div>
                </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
