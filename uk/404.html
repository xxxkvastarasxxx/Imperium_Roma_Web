<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="Цю сторінку на Imperium Roma не знайдено." />
    <title>Сторінку не знайдено — Imperium Roma</title>
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/images/icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/images/icons/favicon-48x48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Imperium Roma">
    <meta name="theme-color" content="#0f0f10">

    <!-- Stylesheet -->
    <!-- Fonts are self-hosted (see @font-face in style.css). Ukrainian pages preload
         the Cyrillic subset: it carries almost all the visible text here. -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/montserrat-cyrillic.woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .error-page {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 140px 20px 80px;
            background: var(--background);
            color: var(--white);
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(72px, 14vw, 140px);
            line-height: 1;
            color: var(--yellow);
            margin: 0;
        }

        .error-title {
            font-family: var(--font-body);
            font-size: clamp(24px, 4vw, 34px);
            margin: 12px 0 16px;
        }

        .error-text {
            max-width: 520px;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.7;
            margin: 0 auto 32px;
        }

        .error-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .error-links a {
            padding: 12px 22px;
            border-radius: var(--radius-pill);
            border: 1.5px solid var(--yellow);
            color: var(--yellow);
            text-decoration: none;
            font-weight: 700;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .error-links a:hover,
        .error-links a:focus-visible {
            background-color: var(--yellow);
            color: #000;
            outline: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <!-- @include partials/header.html -->

    <main>
        <section class="error-page">
            <p class="error-code">404</p>
            <h1 class="error-title">Цю сторінку не знайдено</h1>
            <p class="error-text">Сторінку, яку ви шукаєте, могли перемістити чи перейменувати, або її ніколи не існувало. Загляньте до нашої бібліотеки статей про монети або поверніться на головну.</p>
            <div class="error-links">
                <a href="{{link:/}}">На головну</a>
                <a href="{{link:/bibliotheca/}}">Бібліотека</a>
                <a href="{{link:/contact/}}">Контакти</a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <!-- @include partials/footer.html -->

    <script src="/assets/js/header.js" defer></script>
    <script src="/assets/js/hamburger.js" defer></script>
    <script src="/assets/js/lang.js" defer></script>
    <script src="/assets/js/newsletter.js" defer></script>
</body>
</html>
