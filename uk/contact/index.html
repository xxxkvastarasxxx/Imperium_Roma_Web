<body>
    <!-- Header -->
    <!-- @include partials/header.html -->

    <main>

    <!-- Main Banner -->
    <section class="banner">
        <div class="banner-image-container">
            <img src="/assets/images/general/contact1.webp" alt="Експертиза античних римських монет">
        </div>
        <div class="banner-content">
            <h1>Зв’яжіться з нами</h1>
            <a href="#contact" class="btn-banner">Написати нам</a>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact-section">
        <div class="container">
            <h2>Контакти</h2>
            <p>Будемо раді вашому листу! Маєте запитання про наші послуги, потрібна допомога чи просто хочете поговорити про римські монети — пишіть, ми на зв’язку</p>
            <form action="/send-telegram.php" method="POST" class="contact-form" enctype="multipart/form-data">
                <!-- Honeypot anti-spam field (keep hidden) -->
                <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;opacity:0;height:0;width:0;" aria-hidden="true">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Ім’я</label>
                        <input type="text" id="name" name="name" required minlength="2" maxlength="80">
                    </div>
                    <div class="form-group">
                        <label for="email">Електронна пошта</label>
                        <input type="email" id="email" name="email" required maxlength="254" autocomplete="email">
                    </div>
                </div>

                <!-- Option values stay in English: they are what the server receives and
                     what the ?subject= links from the Services page match against. -->
                <div class="form-group">
                    <label for="subject">Тема</label>
                    <select id="subject" name="subject" required>
                        <option value="" disabled selected>Оберіть тему</option>
                        <option value="identification">Ідентифікація</option>
                        <option value="market evaluation">Ринкова оцінка</option>
                        <option value="authenticity check">Перевірка автентичності</option>
                        <option value="data parsing">Парсинг даних</option>
                        <option value="promote your lot">Просування лоту</option>
                        <option value="custom request">Індивідуальний запит</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Повідомлення</label>
                    <textarea id="message" name="message" rows="5" required minlength="10" maxlength="4000"></textarea>
                </div>
                <div class="form-group form-group--file">
                    <label for="file">Прикріпити файли (до 5)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="file" name="file[]" multiple accept="image/jpeg,image/png">
                        <button type="button" id="customButton" class="custom-file-upload">Обрати файли</button>
                    </div>
                    <ul id="fileList"></ul> <!-- File list area -->
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-submit">Надіслати повідомлення</button>
                </div>
            </form>
        </div>
    </section>
