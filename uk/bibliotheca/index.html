                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/how-were-roman-coins-made/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Як карбували римські монети? Усередині імперського монетного двору</a><br><span style="color:#888;font-size:14px;">Вирізані вручну штемпелі, литі заготовки й один удар молота — як Рим карбував монети мільярдами і які сліди цей процес лишає на монеті.</span></li>

                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/what-does-sc-mean-on-roman-coins/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Що означає SC на римській монеті?</a><br><span style="color:#888;font-size:14px;">SC означає Senatus Consulto — за рішенням Сенату. Чому це позначення є на латуні та бронзі, але ніколи — на імперському золоті чи сріблі.</span></li>
                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/how-to-clean-roman-coins/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Чи варто чистити античну римську монету? Майже завжди — ні</a><br><span style="color:#888;font-size:14px;">Чищення — найшвидший спосіб знищити вартість римської монети. Що безпечно, що ні, і єдиний виняток.</span></li>
                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/is-it-legal-to-own-roman-coins/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Чи законно купувати та володіти античними римськими монетами?</a><br><span style="color:#888;font-size:14px;">Колекціонувати римські монети законно в більшості країн — за умови, що монета законно залишила країну походження. Що це означає на практиці.</span></li>
                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/how-to-identify-a-roman-coin/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Як ідентифікувати римську монету за шість кроків</a><br><span style="color:#888;font-size:14px;">Повторюваний метод, щоб назвати й датувати невизначену римську монету: від металу та ваги до знака монетного двору.</span></li>
                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/how-much-is-a-roman-coin-worth/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Скільки коштує римська монета? Реалістичний ціновий орієнтир</a><br><span style="color:#888;font-size:14px;">Орієнтовні цінові діапазони за номіналом і станом, п’ять чинників, що визначають вартість, і як перевірити реальні ціни продажу.</span></li>
                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/is-my-roman-coin-real/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Як зрозуміти, чи справжня римська монета: 9 перевірок удома</a><br><span style="color:#888;font-size:14px;">Дев’ять практичних перевірок — вага, магнетизм, шов на гурті, фактура поверхні, стиль — які виявляють більшість підробок.</span></li>
                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/denarius-silver-standard/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Денарій: срібний стандарт Риму</a><br><span style="color:#888;font-size:14px;">Карбований понад п’ять століть, денарій був основою римської торгівлі — його походження, еволюція та іконографія.</span></li>
                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/reading-coin-legends/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Читаємо легенди монет: посібник для початківців</a><br><span style="color:#888;font-size:14px;">Латинські написи на римських монетах розповідають про імператорів, трибунські повноваження та перемоги. Розшифровуємо скорочення крок за кроком.</span></li>
                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/aureus-vs-denarius/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Ауреус проти денарія: ієрархія монет</a><br><span style="color:#888;font-size:14px;">Від скромного аса до престижного ауреуса — повний спектр римських номіналів та їхньої вартості.</span></li>
                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/mint-marks-and-workshops/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Знаки монетних дворів та офіцини: читаємо контрольні позначки</a><br><span style="color:#888;font-size:14px;">Літери в екзергу монети — під основним зображенням — точно вказують, де й коли її відкарбували. Як їх розшифрувати.</span></li>
                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/roman-portraiture-on-coins/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Імператорський портрет: як імператори формували свій образ</a><br><span style="color:#888;font-size:14px;">Портрет на римській монеті був продуманою політичною заявою. Як імператори використовували мистецтво та образи, щоб транслювати владу по всій імперії.</span></li>
                    <li style="margin-bottom:18px;"><a href="{{link:/bibliotheca/coin-grading-guide/}}" style="color:#ffcc00;font-size:18px;text-decoration:none;">Грейдинг римських монет: від Fine до Mint State</a><br><span style="color:#888;font-size:14px;">Ступінь збереженості визначає ринкову вартість і привабливість монети. Стандартні грейди для античних римських монет і на що звертати увагу.</span></li>
                </ul>
